<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mood Garden</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <!-- Header -->
    <header class="intro">

      <p class="eyebrow">
        MOOD GARDEN
      </p>

      <h1>
        Grow what you feel.
      </h1>

      <p class="description">
        Every feeling becomes a plant.
        Keep growing to see your mood garden change over time.
      </p>

    </header>


    <!-- Main Garden -->
    <section class="garden-section">

      <div id="garden" class="garden">

        <div class="sun-glow"></div>

        <div class="hill hill-back"></div>
        <div class="hill hill-front"></div>

        <div id="empty-message" class="empty-message">
          <span>Your garden is waiting.</span>
          <p>Choose a feeling and plant your first mood.</p>
        </div>

        <div id="plants-layer" class="plants-layer"></div>

      </div>


      <!-- Bottom controls -->
      <div class="control-panel">

        <div class="control-left">

          <p class="control-label">
            How are you feeling?
          </p>

          <div class="mood-buttons">

            <button class="mood-button" data-mood="calm">
              Calm
            </button>

            <button class="mood-button" data-mood="happy">
              Happy
            </button>

            <button class="mood-button" data-mood="tired">
              Tired
            </button>

            <button class="mood-button" data-mood="anxious">
              Anxious
            </button>

            <button class="mood-button" data-mood="excited">
              Excited
            </button>

          </div>

        </div>


        <div class="control-middle">

          <div class="intensity-header">
            <span>Mood intensity</span>
            <span id="intensity-value">3 / 5</span>
          </div>

          <input
            type="range"
            id="intensity"
            min="1"
            max="5"
            value="3"
          >

          <div class="range-labels">
            <span>soft</span>
            <span>strong</span>
          </div>

        </div>


        <div class="control-right">

          <button id="grow-button" class="grow-button">
            Grow a feeling
          </button>

        </div>

      </div>


      <!-- Feedback -->
      <div class="feedback-row">

        <p id="message" class="message">
          Choose a mood to begin.
        </p>

        <p id="plant-count" class="plant-count">
          0 plants growing
        </p>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
