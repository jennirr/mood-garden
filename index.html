<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mood Garden</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <main class="page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="intro">

      <p class="eyebrow">
        MOOD GARDEN
      </p>

      <h1>
        Grow what you feel.
      </h1>

      <p class="description">
        Every feeling becomes a plant.
        Keep growing to see your mood garden
        change over time.
      </p>

    </header>


    <!-- =========================
         GARDEN
    ========================== -->

    <section class="garden-section">

      <div
        id="garden"
        class="garden"
      >

        <div class="sun-glow"></div>

        <div class="hill hill-back"></div>
        <div class="hill hill-front"></div>


        <!-- Empty garden message -->

        <div
          id="empty-message"
          class="empty-message"
        >

          <span>
            Your garden is waiting.
          </span>

          <p>
            Choose a feeling and plant your first mood.
          </p>

        </div>


        <!-- Plants appear here -->

        <div
          id="plants-layer"
          class="plants-layer"
        ></div>

      </div>


      <!-- =========================
           CONTROLS
      ========================== -->

      <div class="control-panel">


        <!-- Mood -->

        <div class="control-left">

          <p class="control-label">
            How are you feeling?
          </p>

          <div class="mood-buttons">

            <button
              class="mood-button"
              data-mood="calm"
            >
              Calm
            </button>

            <button
              class="mood-button"
              data-mood="happy"
            >
              Happy
            </button>

            <button
              class="mood-button"
              data-mood="tired"
            >
              Tired
            </button>

            <button
              class="mood-button"
              data-mood="anxious"
            >
              Anxious
            </button>

            <button
              class="mood-button"
              data-mood="excited"
            >
              Excited
            </button>

          </div>

        </div>


        <!-- Intensity -->

        <div class="control-middle">

          <div class="intensity-header">

            <span>
              Mood intensity
            </span>

            <span
              id="intensity-value"
              class="intensity-value"
            >
              Medium
            </span>

          </div>


          <input
            type="range"
            id="intensity"
            min="1"
            max="3"
            step="1"
            value="2"
          >


          <div class="range-labels">

            <span>
              Low
            </span>

            <span>
              Medium
            </span>

            <span>
              High
            </span>

          </div>

        </div>


        <!-- Grow -->

        <div class="control-right">

          <button
            id="grow-button"
            class="grow-button"
          >
            Grow a feeling
          </button>

        </div>

      </div>


      <!-- =========================
           FEEDBACK
      ========================== -->

      <div class="feedback-row">

        <p
          id="message"
          class="message"
        >
          Choose a mood to begin.
        </p>

        <p
          id="plant-count"
          class="plant-count"
        >
          0 plants growing
        </p>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
